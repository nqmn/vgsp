[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgsp"
version = "0.1.1"
description = "Supervised variance-guided scalar projection using bounded class-variance ratios"
readme = "PYPI_README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mohd Adil Mokti" }]
keywords = ["VGSP", "CVR", "supervised dimensionality reduction", "SDN", "DDoS", "machine learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.6,<2",
]

[project.urls]
Homepage = "https://github.com/nqmn/vgsp"
Source = "https://github.com/nqmn/vgsp"
Issues = "https://github.com/nqmn/vgsp/issues"
Research-archive = "https://doi.org/10.5281/zenodo.24183611"

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
